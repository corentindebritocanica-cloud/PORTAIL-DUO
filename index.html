<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#17181b">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  :root{
    --panel: #201f22;
    --panel-edge: #2b2a2e;
    --brass: #c9a35c;
    --brass-dim: #8a7346;
    --ink: #eae6db;
    --ink-dim: #8b877e;
    --blue: #1f8fff;
    --gold: #e0a940;
    --green: #4caf6d;
    --bg: #101113;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 90% at 50% -10%, #1c1d20 0%, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  .plate{
    width:100%;
    max-width:400px;
    background: linear-gradient(160deg, var(--panel-edge), var(--panel) 40%);
    border-radius:22px;
    padding:34px 26px 28px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 40px 80px -30px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.03);
    position:relative;
    opacity:0;
    transform:translateY(14px);
    animation: rise .6s cubic-bezier(.2,.7,.3,1) forwards;
  }

  .plate::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid rgba(201,163,92,0.18);
    border-radius:14px;
    pointer-events:none;
  }

  .screw{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #d8d0bf, var(--brass-dim));
  }
  .screw.tl{top:9px;left:9px;} .screw.tr{top:9px;right:9px;}
  .screw.bl{bottom:9px;left:9px;} .screw.br{bottom:9px;right:9px;}

  header{
    text-align:center;
    margin-bottom:28px;
  }
  .glyph{
    width:52px;height:52px;
    margin:0 auto 16px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 0 2px rgba(201,163,92,0.4), 0 8px 18px -6px rgba(0,0,0,0.6);
  }
  .glyph svg{display:block;width:100%;height:100%;}

  h1{
    margin:0;
    font-size:23px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .sub{
    margin:6px 0 0;
    font-size:13px;
    color:var(--ink-dim);
  }

  .doors{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .door{
    --c: var(--blue);
    appearance:none;
    border:none;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:14px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.07);
    border-radius:14px;
    color:var(--ink);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .door:active{
    transform: scale(0.97);
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  }

  .bulb{
    width:34px;height:34px;
    flex:none;
    border-radius:50%;
    background: var(--c);
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.05),
      0 0 14px 2px color-mix(in srgb, var(--c) 55%, transparent);
    display:flex;align-items:center;justify-content:center;
  }
  .bulb svg{width:17px;height:17px;fill:#0f0f10;}

  .label{flex:1;min-width:0;}
  .name{
    display:block;
    font-size:16px;
    font-weight:600;
    line-height:1.25;
  }
  .desc{
    display:block;
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:1px;
  }

  .arrow{
    flex:none;
    color: var(--ink-dim);
    font-size:16px;
    transition: transform .15s ease;
  }
  .door:active .arrow{ transform: translateX(2px); }

  footer{
    text-align:center;
    margin-top:24px;
    font-size:11px;
    color: var(--brass-dim);
    letter-spacing:0.02em;
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .plate{ animation:none; opacity:1; transform:none; }
    .door{ transition:none; }
  }

  .cache-reset{
    appearance:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:14px;
    padding:9px 10px;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:11px;
    letter-spacing:0.02em;
    opacity:0.5;
    cursor:pointer;
    transition: opacity .15s ease;
  }
  .cache-reset svg{
    width:12px;height:12px;
    flex:none;
    transition: transform .5s ease;
  }
  .cache-reset:active{ opacity:1; }
  .cache-reset.busy svg{ animation: spin .8s linear infinite; }
  .cache-reset:disabled{ opacity:0.35; cursor:default; }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <main class="plate">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <header>
      <div class="glyph">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#201f22"/>
          <rect x="10" y="10" width="80" height="80" rx="10" fill="none" stroke="#c9a35c" stroke-width="3"/>
          <rect x="16" y="16" width="21" height="68" rx="4" fill="#1f8fff"/>
          <rect x="39.5" y="16" width="21" height="68" rx="4" fill="#e0a940"/>
          <rect x="63" y="16" width="21" height="68" rx="4" fill="#4caf6d"/>
        </svg>
      </div>
      <h1>Portail Duo</h1>
      <p class="sub">Corentin &amp; Lisa — choisissez une porte</p>
    </header>

    <nav class="doors">
      <button class="door" style="--c:var(--blue)" data-url="./Muscu/">
        <span class="bulb">
          <svg viewBox="0 0 24 24" fill="#0f0f10"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4" y="7" width="2" height="10" rx="1"/><rect x="6" y="10.5" width="12" height="3"/><rect x="18" y="7" width="2" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg>
        </span>
        <span class="label">
          <span class="name">Musculation</span>
          <span class="desc">Séances, progressions &amp; coach IA</span>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="door" style="--c:var(--gold)" data-url="./Budget/">
        <span class="bulb">
          <svg viewBox="0 0 24 24"><path d="M12 1a11 11 0 1 0 11 11A11 11 0 0 0 12 1Zm.9 16.1v1.4h-1.8v-1.4c-1.7-.3-3-1.3-3.1-3h1.8c.1.8.7 1.4 2 1.4 1.2 0 2-.6 2-1.5 0-.8-.6-1.3-2.2-1.7-2-.5-3.4-1.3-3.4-3.1 0-1.5 1.2-2.6 2.9-2.9V4.5h1.8v1.4c1.6.3 2.7 1.4 2.8 2.9h-1.8c-.1-.8-.6-1.4-1.7-1.4-1.1 0-1.8.5-1.8 1.3 0 .7.6 1.1 2.1 1.5 2.2.5 3.5 1.4 3.5 3.3 0 1.6-1.2 2.7-3.1 3Z"/></svg>
        </span>
        <span class="label">
          <span class="name">Budget</span>
          <span class="desc">Charges, dépenses &amp; provisions</span>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="door" style="--c:var(--green)" data-url="./Course/">
        <span class="bulb">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0f0f10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" fill="#0f0f10" stroke="none"/><circle cx="20" cy="21" r="1" fill="#0f0f10" stroke="none"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </span>
        <span class="label">
          <span class="name">Courses</span>
          <span class="desc">Saisie &amp; liste au supermarché</span>
        </span>
        <span class="arrow">›</span>
      </button>
    </nav>

    <footer>Portail Duo · pas de compte, pas de cloud</footer>

    <button class="cache-reset" id="cache-reset" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span id="cache-reset-label">Vider le cache</span>
    </button>
  </main>

<script>
  document.querySelectorAll('.door').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.getAttribute('data-url');
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => { window.location.href = url; }, 120);
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Vidage manuel du cache (service worker + Cache Storage) et
  // redémarrage forcé de l'app pour recharger la dernière version
  // publiée sur GitHub. Utile car le cache iOS/Safari ne se vide pas
  // toujours tout seul après une mise à jour distante.
  const cacheResetBtn = document.getElementById('cache-reset');
  const cacheResetLabel = document.getElementById('cache-reset-label');

  async function clearCacheAndRestart() {
    if (!cacheResetBtn || cacheResetBtn.disabled) return;
    cacheResetBtn.disabled = true;
    cacheResetBtn.classList.add('busy');
    cacheResetLabel.textContent = 'Nettoyage…';

    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) {
      console.warn('Vidage du cache incomplet :', e);
    } finally {
      cacheResetLabel.textContent = 'Redémarrage…';
      // Query string unique pour forcer le navigateur/iOS à récupérer
      // index.html en réseau plutôt que depuis une éventuelle copie locale.
      window.location.replace('./index.html?_reset=' + Date.now());
    }
  }

  if (cacheResetBtn) {
    cacheResetBtn.addEventListener('click', clearCacheAndRestart);
  }
</script>

</body>
</html>
