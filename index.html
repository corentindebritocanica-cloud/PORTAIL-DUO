<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d1014">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
  :root{
    /* Tokens repris tels quels de Muscu ("Ardoise & Craie") */
    --bg:#0d1014;
    --card:#161b22;
    --card-2:#1e2530;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.17);
    --text:#e9eff6;
    --text-dim:#8a97a8;
    --corentin:#1f8fff;
    --corentin-dark:#1a5fc4;
    --lisa:#ff3d7e;
    --lisa-dark:#c4225f;
    --done:#12b981;
    --gold:#ffb800;
    --accent: var(--corentin);
    --accent-rgb: 31,143,255;
    --accent-glow: rgba(var(--accent-rgb), 0.30);
    --r-sm:10px;
    --r-md:14px;
    --r-lg:18px;
    --shadow-sm: 0 6px 16px rgba(0,0,0,0.30);
    --shadow: 0 14px 32px rgba(0,0,0,0.44), 0 2px 8px rgba(0,0,0,0.28);
    --t-fast:.14s;
    --t-mid:.22s;
    --f-display: 'Bebas Neue', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  html.light-mode{
    --bg:#eef1f5;
    --card:#ffffff;
    --card-2:#e7ecf2;
    --border:rgba(23,38,56,0.11);
    --border-strong:rgba(23,38,56,0.20);
    --text:#131a23;
    --text-dim:#5f6c7c;
    --shadow-sm: 0 6px 14px rgba(20,30,45,0.08);
    --shadow: 0 14px 28px rgba(20,30,45,0.10), 0 2px 8px rgba(20,30,45,0.05);
    --accent-glow: rgba(var(--accent-rgb), 0.22);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: background .25s ease, color .25s ease;
  }
  body{ min-height:100vh; position:relative; }

  /* Poussière de craie, reprise à l'identique de Muscu — désactivée en clair */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(238,240,238,.5), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(238,240,238,.4), transparent),
      radial-gradient(1.5px 1.5px at 32% 64%, rgba(238,240,238,.35), transparent),
      radial-gradient(1px 1px at 91% 47%, rgba(238,240,238,.4), transparent),
      radial-gradient(1.5px 1.5px at 58% 82%, rgba(238,240,238,.3), transparent),
      radial-gradient(1px 1px at 6% 88%, rgba(238,240,238,.35), transparent);
    background-repeat:no-repeat;
  }
  html.light-mode body::before{ display:none; }

  .theme-toggle, .cache-toggle{
    position:fixed; top:14px; z-index:25;
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; box-shadow: var(--shadow-sm);
    cursor:pointer;
  }
  .theme-toggle{ right:14px; }
  .cache-toggle{ right:60px; }
  .cache-toggle.spinning{ animation: spin .6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .view-inner{
    position:relative; z-index:1;
    max-width:460px; margin:0 auto;
    padding:78px 18px 34px;
    padding-top:calc(env(safe-area-inset-top,0px) + 78px);
    display:flex; flex-direction:column; gap:14px;
  }

  .app-title{
    font-size:12.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--text-dim); margin:0 0 4px 2px; font-weight:700;
  }
  .app-title-brand{ color:var(--accent); }

  .big-question{
    font-family:var(--f-display); text-transform:uppercase;
    font-size:29px; font-weight:850; letter-spacing:.01em; margin:4px 2px 20px 2px;
  }

  .big-choice-btn{
    padding:26px 20px; border-radius:var(--r-lg); border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:flex-start; gap:16px; margin-bottom:14px;
    box-shadow: var(--shadow-sm); position:relative; text-decoration:none;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .big-choice-btn:active{ transform: scale(0.98); }

  .choice-icon{
    width:46px; height:46px; flex:0 0 auto; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .big-choice-btn.muscu .choice-icon{
    background:linear-gradient(150deg, var(--corentin), var(--corentin-dark)); color:#fff;
  }
  .big-choice-btn.budget .choice-icon{
    background:linear-gradient(150deg, var(--gold), #b8860b); color:#20160a;
  }
  .big-choice-btn.course .choice-icon{
    background:linear-gradient(150deg, var(--done), #0d9468); color:#fff;
  }

  .choice-label{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
  .choice-name{ font-family:var(--f-display); text-transform:uppercase; letter-spacing:.02em; font-size:17px; }
  .choice-desc{ font-size:12.5px; font-weight:500; color:var(--text-dim); }
  .chevron{ font-size:20px; color:var(--text-dim); flex:0 0 auto; }

  .footer-note{
    text-align:center; font-size:11px; color:var(--text-dim); opacity:.75; margin-top:6px;
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème">🌙</button>
  <button class="cache-toggle" id="cache-btn" aria-label="Vider le cache et redémarrer">🔄</button>

  <div class="view-inner">
    <p class="app-title"><span class="app-title-brand">Portail Duo</span> · Corentin &amp; Lisa</p>
    <h1 class="big-question">Où va-t-on&nbsp;?</h1>

    <a class="big-choice-btn muscu" href="./Muscu/">
      <span class="choice-icon">🏋️</span>
      <span class="choice-label">
        <span class="choice-name">Musculation</span>
        <span class="choice-desc">Séances, progressions &amp; coach IA</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <a class="big-choice-btn budget" href="./Budget/">
      <span class="choice-icon">💶</span>
      <span class="choice-label">
        <span class="choice-name">Budget</span>
        <span class="choice-desc">Charges, dépenses &amp; provisions</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <a class="big-choice-btn course" href="./Course/">
      <span class="choice-icon">🛒</span>
      <span class="choice-label">
        <span class="choice-name">Courses</span>
        <span class="choice-desc">Saisie &amp; liste au supermarché</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <p class="footer-note">Portail Duo · pas de compte, pas de cloud</p>
  </div>

<script>
(function(){
  const THEME_KEY = 'duo_theme';

  function getTheme(){
    try { return localStorage.getItem(THEME_KEY) || 'dark'; }
    catch (e) { return 'dark'; }
  }
  function applyTheme(theme){
    document.documentElement.classList.toggle('light-mode', theme === 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  }
  function toggleTheme(){
    const next = getTheme() === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  }
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  applyTheme(getTheme());

  // Service worker du shell (inchangé)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Vidage de cache + redémarrage (tap simple, comme le reste de l'app)
  const cacheBtn = document.getElementById('cache-btn');
  let busy = false;

  async function clearCacheAndRestart(){
    if (busy) return;
    busy = true;
    cacheBtn.classList.add('spinning');
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) {
      console.warn('Vidage du cache incomplet :', e);
    } finally {
      setTimeout(() => {
        window.location.replace('./index.html?_reset=' + Date.now());
      }, 380);
    }
  }

  cacheBtn.addEventListener('click', clearCacheAndRestart);
})();
</script>

</body>
</html>
