<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eee6d3">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  :root{
    --sand: #f1ead8;
    --sand-2: #e4dabf;
    --ink: #3c362b;
    --ink-dim: rgba(60,54,43,0.5);
    --stone-blue: #64767e;
    --stone-gold: #b3854a;
    --stone-green: #6d8a5b;
    --water: #6fa3bf;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--sand); }
  body{
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .garden{
    position:fixed; inset:0;
    overflow:hidden;
    background: radial-gradient(120% 85% at 50% 8%, var(--sand) 0%, var(--sand-2) 100%);
  }

  .rake{ position:absolute; inset:0; width:100%; height:100%; }
  .rake-line{ stroke:var(--ink); stroke-opacity:.1; stroke-width:1; fill:none; }
  .ring{ stroke:var(--ink); stroke-opacity:.16; fill:none; stroke-width:1; }

  .stone{
    position:absolute;
    display:flex; flex-direction:column; align-items:center;
    transform:translate(-50%,-50%);
    cursor:pointer;
  }
  .stone .rock{
    background: radial-gradient(120% 120% at 30% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
                linear-gradient(155deg, var(--c-light), var(--c-dark));
    border-radius: 58% 42% 55% 45% / 45% 55% 45% 55%;
    box-shadow: 0 10px 18px -8px rgba(30,26,18,.35), 0 2px 3px rgba(30,26,18,.2);
    transition: transform .28s ease, filter .28s ease;
  }
  .stone::after{
    content:"";
    position:absolute;
    left:50%; bottom:-8px;
    width:78%; height:14px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(40,34,22,.22), transparent 75%);
    border-radius:50%;
    z-index:-1;
  }
  .stone.tapped .rock{ transform:scale(.88); filter:brightness(1.18); }
  .stone .label{ margin-top:14px; text-align:center; transition:opacity .3s ease; }
  .stone .label .name{
    display:block; font-size:14px; letter-spacing:.28em;
    font-variant:small-caps; color:var(--ink);
  }
  .stone .label .desc{
    display:block; margin-top:5px; font-size:11px; font-style:italic; color:var(--ink-dim);
  }
  .stone.tapped .label{ opacity:0; }

  .plaque{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 18px);
    left:22px;
    pointer-events:none;
  }
  .plaque .t1{ display:block; font-size:11px; letter-spacing:.4em; font-variant:small-caps; color:var(--ink); opacity:.7; }
  .plaque .t2{ display:block; margin-top:3px; font-size:10px; font-style:italic; color:var(--ink-dim); }

  .basin-zone{
    position:fixed;
    right:20px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .basin{
    width:52px; height:40px;
    position:relative;
    cursor:pointer;
    touch-action:none;
  }
  .basin svg{ width:100%; height:100%; overflow:visible; }
  .basin .bowl{ fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.4; }
  .basin .water{ fill:var(--water); opacity:.55; }
  .basin .drop{
    fill:var(--water);
    transform-origin:center;
    animation: dropFall 3.2s ease-in infinite;
  }
  @keyframes dropFall{
    0%{ transform:translateY(-6px); opacity:0; }
    12%{ opacity:1; }
    40%{ transform:translateY(10px); opacity:0; }
    100%{ transform:translateY(10px); opacity:0; }
  }
  .basin.charging .water{ opacity:.9; }
  .basin-caption{ font-size:9.5px; font-style:italic; letter-spacing:.03em; color:var(--ink-dim); opacity:.7; }

  .ripple{
    position:fixed; inset:0;
    pointer-events:none;
    background: radial-gradient(circle at var(--ox,50%) var(--oy,50%), var(--c,#fff) 0%, transparent 55%);
    opacity:0;
    transform:scale(.15);
    transform-origin: var(--ox,50%) var(--oy,50%);
  }
  .garden.rippling .ripple{ animation: rippleGrow .78s ease forwards; }
  @keyframes rippleGrow{
    0%{ opacity:0; transform:scale(.15); }
    35%{ opacity:.5; }
    100%{ opacity:.95; transform:scale(2.8); }
  }

  .basin-ripple{
    position:fixed; inset:0;
    pointer-events:none;
    background: radial-gradient(circle at var(--bx,88%) var(--by,88%), var(--sand) 0%, transparent 60%);
    opacity:0;
  }
  .garden.washing .basin-ripple{ animation: washGrow .9s ease forwards; }
  @keyframes washGrow{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .basin .drop{ animation:none; opacity:.6; }
    .stone .rock, .stone .label{ transition:none; }
  }
</style>
</head>
<body>

  <div class="garden" id="garden">

    <svg class="rake" preserveAspectRatio="none" viewBox="0 0 400 800">
      <defs>
        <pattern id="rakePattern" width="46" height="14" patternUnits="userSpaceOnUse">
          <path class="rake-line" d="M-5 7 Q6 1 17 7 T39 7 T61 7"/>
        </pattern>
      </defs>
      <rect width="400" height="800" fill="url(#rakePattern)"/>
      <circle class="ring" cx="112" cy="496" r="66"/>
      <circle class="ring" cx="112" cy="496" r="86"/>
      <circle class="ring" cx="272" cy="304" r="58"/>
      <circle class="ring" cx="272" cy="304" r="76"/>
      <circle class="ring" cx="180" cy="656" r="72"/>
      <circle class="ring" cx="180" cy="656" r="94"/>
    </svg>

    <div class="stone" id="stone-muscu" data-url="./Muscu/" data-color="#64767e" style="left:28%; top:62%;">
      <div class="rock" style="width:78px; height:60px; --c-light:#8b9aa1; --c-dark:#4d5c63;"></div>
      <div class="label">
        <span class="name">Musculation</span>
        <span class="desc">Séances, progressions &amp; coach IA</span>
      </div>
    </div>

    <div class="stone" id="stone-budget" data-url="./Budget/" data-color="#b3854a" style="left:68%; top:38%;">
      <div class="rock" style="width:64px; height:50px; --c-light:#d3ac74; --c-dark:#8c6535;"></div>
      <div class="label">
        <span class="name">Budget</span>
        <span class="desc">Charges, dépenses &amp; provisions</span>
      </div>
    </div>

    <div class="stone" id="stone-course" data-url="./Course/" data-color="#6d8a5b" style="left:47%; top:83%;">
      <div class="rock" style="width:92px; height:70px; --c-light:#8fac7c; --c-dark:#4c6440;"></div>
      <div class="label">
        <span class="name">Courses</span>
        <span class="desc">Saisie &amp; liste au supermarché</span>
      </div>
    </div>

    <div class="ripple" id="ripple"></div>
    <div class="basin-ripple" id="basinRipple"></div>
  </div>

  <div class="plaque">
    <span class="t1">Portail Duo</span>
    <span class="t2">Corentin &amp; Lisa</span>
  </div>

  <div class="basin-zone">
    <div class="basin" id="basin" role="button" tabindex="0" aria-label="Vider le cache et redémarrer">
      <svg viewBox="0 0 52 40">
        <path class="bowl" d="M6 18 Q26 30 46 18"/>
        <path class="bowl" d="M4 18 L48 18"/>
        <ellipse class="water" cx="26" cy="19" rx="19" ry="4.5"/>
        <circle class="drop" cx="26" cy="4" r="2.4"/>
      </svg>
    </div>
    <span class="basin-caption">bassin · maintenir pour rafraîchir</span>
  </div>

<script>
(function(){
  const garden = document.getElementById('garden');
  const ripple = document.getElementById('ripple');
  const stones = Array.from(document.querySelectorAll('.stone'));

  stones.forEach((stone) => {
    stone.addEventListener('click', () => launch(stone));
    stone.setAttribute('role', 'link');
    stone.setAttribute('tabindex', '0');
    stone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        launch(stone);
      }
    });
  });

  function launch(stone){
    if (garden.classList.contains('rippling')) return;
    const rect = stone.getBoundingClientRect();
    const ox = ((rect.left + rect.width / 2) / window.innerWidth * 100).toFixed(2) + '%';
    const oy = ((rect.top + rect.height / 2) / window.innerHeight * 100).toFixed(2) + '%';
    ripple.style.setProperty('--ox', ox);
    ripple.style.setProperty('--oy', oy);
    ripple.style.setProperty('--c', stone.dataset.color);
    stone.classList.add('tapped');
    garden.classList.add('rippling');
    setTimeout(() => { window.location.href = stone.dataset.url; }, 760);
  }

  // Service worker du shell (inchangé)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Bassin — vidage de cache + redémarrage (maintenir le doigt)
  const basin = document.getElementById('basin');
  const basinRipple = document.getElementById('basinRipple');
  let holdTimer = null;
  let triggered = false;

  async function clearCacheAndRestart(){
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) {
      console.warn('Vidage du cache incomplet :', e);
    } finally {
      setTimeout(() => {
        window.location.replace('./index.html?_reset=' + Date.now());
      }, 480);
    }
  }

  function triggerReset(){
    if (triggered) return;
    triggered = true;
    const rect = basin.getBoundingClientRect();
    const bx = ((rect.left + rect.width / 2) / window.innerWidth * 100).toFixed(2) + '%';
    const by = ((rect.top + rect.height / 2) / window.innerHeight * 100).toFixed(2) + '%';
    basinRipple.style.setProperty('--bx', bx);
    basinRipple.style.setProperty('--by', by);
    basin.classList.add('charging');
    garden.classList.add('washing');
    clearCacheAndRestart();
  }

  basin.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    triggered = false;
    holdTimer = setTimeout(triggerReset, 600);
  });
  function releaseBasin(){
    clearTimeout(holdTimer);
    if (!triggered) basin.classList.remove('charging');
  }
  basin.addEventListener('pointerup', releaseBasin);
  basin.addEventListener('pointercancel', releaseBasin);
  basin.addEventListener('pointerleave', releaseBasin);
  basin.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      triggerReset();
    }
  });
})();
</script>

</body>
</html>
