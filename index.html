<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#05060c">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  :root{
    --void: #05060c;
    --void-2: #0b0e1c;
    --star: #f4efe0;
    --star-dim: rgba(244,239,224,0.4);
    --gold: #d9b273;
    --gold-dim: #8a7148;
    --blue: #63c8ff;
    --green: #71e3a4;
    --comet: #ff9a5c;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--void); }
  body{
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    color: var(--star);
    -webkit-font-smoothing:antialiased;
  }

  .sky{
    position:fixed; inset:0;
    overflow:hidden;
    touch-action:none;
    background: radial-gradient(140% 90% at 50% 120%, var(--void-2) 0%, var(--void) 60%);
  }

  .stars{ position:absolute; inset:-10% -50% -10% -50%; pointer-events:none; }
  .stars i{
    position:absolute;
    width:2px; height:2px;
    background:var(--star);
    border-radius:50%;
    animation: twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15 } 50%{ opacity:.9 } }

  .rail-scale{ position:absolute; inset:0; }
  .rail{
    position:absolute; top:0; left:0;
    height:100%; width:300vw;
    display:flex;
    will-change:transform;
  }

  .slot{
    width:100vw; height:100%;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity:.28;
    transform:scale(.86);
    filter:saturate(.35) brightness(.65);
    transition:opacity .5s ease, transform .5s ease, filter .5s ease;
    pointer-events:none;
  }
  .slot.active{ opacity:1; transform:scale(1); filter:none; pointer-events:auto; }

  .slot.warping-slot .constellation{
    transition: transform .62s cubic-bezier(.3,0,1,1), opacity .5s ease .1s;
  }
  .slot.warping-slot .constellation{ transform:scale(2.6); }
  .slot.warping-slot .label{ opacity:0; transition:opacity .25s ease; }
  .slot.warping-slot .hub{ animation: hubBurst .62s ease forwards; }
  @keyframes hubBurst{ to{ r:44; opacity:0; } }

  .constellation{ width:min(72vw,320px); overflow:visible; }
  .constellation line{ stroke:var(--c); stroke-width:1; opacity:.55; }
  .constellation circle.pt{ fill:var(--star); }
  .constellation circle.hub{
    fill:var(--c);
    filter: drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 14px var(--c));
    animation: pulseHub 2.6s ease-in-out infinite;
  }
  @keyframes pulseHub{ 0%,100%{ r:6 } 50%{ r:7.4 } }
  .hub-hit{ fill:transparent; pointer-events:all; cursor:pointer; }

  .label{ margin-top:24px; text-align:center; }
  .label .name{
    display:block; font-size:15px; letter-spacing:.32em;
    font-variant:small-caps; color:var(--c);
  }
  .label .desc{
    display:block; margin-top:7px; font-size:12px; font-style:italic; color:var(--star-dim);
  }

  .plaque{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 18px);
    left:22px;
    pointer-events:none;
  }
  .plaque .t1{ display:block; font-size:11px; letter-spacing:.4em; font-variant:small-caps; color:var(--gold); opacity:.85; }
  .plaque .t2{ display:block; margin-top:3px; font-size:10px; font-style:italic; color:var(--star-dim); }

  .dots{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    left:0; right:0;
    display:flex; justify-content:center; gap:10px;
    pointer-events:none;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--star-dim);
    pointer-events:all; cursor:pointer;
    transition:background .3s ease, transform .3s ease;
  }
  .dot.active{ background:var(--star); transform:scale(1.3); }

  .comet-zone{
    position:fixed;
    right:20px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 52px);
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .comet{
    width:44px; height:44px;
    position:relative;
    animation:drift 5s ease-in-out infinite;
    touch-action:none;
    cursor:pointer;
  }
  .comet svg{ width:100%; height:100%; overflow:visible; }
  .comet .core{ fill:var(--comet); filter:drop-shadow(0 0 5px var(--comet)); }
  .comet .tail{ stroke:var(--comet); stroke-width:1.4; }
  @keyframes drift{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(-4px,-6px) } }
  .comet.charging{ animation:none; }
  .comet.charging .core{ filter:drop-shadow(0 0 5px var(--comet)) drop-shadow(0 0 16px var(--comet)); }
  .comet.launch{
    animation:none;
    transition: transform .5s cubic-bezier(.4,0,1,1), opacity .5s ease;
    transform: translate(-140vw,-90vh) scale(.4);
    opacity:0;
  }
  .comet-caption{ font-size:9.5px; font-style:italic; letter-spacing:.03em; color:var(--star-dim); opacity:.65; }

  .flash{
    position:fixed; inset:0;
    pointer-events:none;
    background: radial-gradient(circle at 50% 50%, var(--c,#fff) 0%, transparent 60%);
    opacity:0;
  }
  .sky.warping .rail-scale{
    transition: transform .62s cubic-bezier(.4,0,1,1), filter .62s ease;
    transform: scale(1.6);
    filter: blur(7px) brightness(1.7);
  }
  .sky.warping .flash{ animation: flashIn .62s ease forwards; }
  @keyframes flashIn{ 0%{ opacity:0 } 55%{ opacity:.92 } 100%{ opacity:1 } }

  @media (prefers-reduced-motion: reduce){
    .comet{ animation:none; }
    .slot{ transition:none; }
    .stars i{ animation:none; opacity:.5; }
  }
</style>
</head>
<body>

  <div class="sky" id="sky">
    <div class="stars" id="stars"></div>

    <div class="rail-scale">
      <div class="rail" id="rail">

        <div class="slot active" data-url="./Muscu/" data-color="#63c8ff">
          <svg class="constellation" style="--c:var(--blue)" viewBox="0 0 220 160">
            <line x1="30" y1="82" x2="190" y2="82"/>
            <circle class="pt" cx="70" cy="82" r="2.2"/>
            <circle class="pt" cx="130" cy="82" r="2.2"/>
            <circle class="pt" cx="30" cy="82" r="5"/>
            <circle class="hub" cx="190" cy="82" r="6"/>
            <circle class="hub-hit" cx="190" cy="82" r="32" role="link" aria-label="Ouvrir Musculation"/>
          </svg>
          <div class="label">
            <span class="name">Musculation</span>
            <span class="desc">Séances, progressions &amp; coach IA</span>
          </div>
        </div>

        <div class="slot" data-url="./Budget/" data-color="#d9b273">
          <svg class="constellation" style="--c:var(--gold)" viewBox="0 0 220 160">
            <line x1="40" y1="132" x2="108" y2="90"/>
            <line x1="108" y1="90" x2="176" y2="34"/>
            <circle class="pt" cx="40" cy="132" r="4"/>
            <circle class="pt" cx="108" cy="90" r="3"/>
            <circle class="hub" cx="176" cy="34" r="6"/>
            <circle class="hub-hit" cx="176" cy="34" r="32" role="link" aria-label="Ouvrir Budget"/>
          </svg>
          <div class="label">
            <span class="name">Budget</span>
            <span class="desc">Charges, dépenses &amp; provisions</span>
          </div>
        </div>

        <div class="slot" data-url="./Course/" data-color="#71e3a4">
          <svg class="constellation" style="--c:var(--green)" viewBox="0 0 220 160">
            <line x1="46" y1="60" x2="110" y2="128"/>
            <line x1="110" y1="128" x2="174" y2="60"/>
            <line x1="110" y1="128" x2="110" y2="46"/>
            <circle class="pt" cx="46" cy="60" r="3.5"/>
            <circle class="pt" cx="174" cy="60" r="3.5"/>
            <circle class="hub" cx="110" cy="46" r="6"/>
            <circle class="hub-hit" cx="110" cy="46" r="32" role="link" aria-label="Ouvrir Courses"/>
          </svg>
          <div class="label">
            <span class="name">Courses</span>
            <span class="desc">Saisie &amp; liste au supermarché</span>
          </div>
        </div>

      </div>
    </div>

    <div class="flash" id="flash"></div>
  </div>

  <div class="plaque">
    <span class="t1">Portail Duo</span>
    <span class="t2">Corentin &amp; Lisa</span>
  </div>

  <div class="dots" id="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <div class="comet-zone">
    <div class="comet" id="comet" role="button" tabindex="0" aria-label="Vider le cache et redémarrer">
      <svg viewBox="0 0 60 60">
        <path class="tail" d="M46 14 L14 46" fill="none" stroke-linecap="round" opacity="0.55"/>
        <path class="tail" d="M50 22 L22 50" fill="none" stroke-linecap="round" opacity="0.3"/>
        <circle class="core" cx="46" cy="14" r="6"/>
      </svg>
    </div>
    <span class="comet-caption">comète · glisser ou maintenir</span>
  </div>

<script>
(function(){
  const sky = document.getElementById('sky');
  const rail = document.getElementById('rail');
  const slots = Array.from(rail.querySelectorAll('.slot'));
  const dots = Array.from(document.querySelectorAll('.dot'));
  const flash = document.getElementById('flash');

  let slotWidth = window.innerWidth;
  let currentIndex = 0;
  let offset = 0;
  let dragging = false;
  let moved = false;
  let dragStartX = 0;
  let dragStartOffset = 0;
  let lastX = 0, lastT = 0, velocity = 0;
  let activePointerId = null;

  function setActive(index, animate){
    currentIndex = Math.max(0, Math.min(slots.length - 1, index));
    offset = -currentIndex * slotWidth;
    rail.style.transition = animate ? 'transform .48s cubic-bezier(.2,.7,.3,1)' : 'none';
    rail.style.transform = 'translateX(' + offset + 'px)';
    slots.forEach((s, i) => s.classList.toggle('active', i === currentIndex));
    dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  }

  function onResize(){
    slotWidth = window.innerWidth;
    setActive(currentIndex, false);
  }
  window.addEventListener('resize', onResize);

  sky.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.comet')) return;
    dragging = true; moved = false;
    activePointerId = e.pointerId;
    try { sky.setPointerCapture(activePointerId); } catch(_) {}
    dragStartX = e.clientX;
    dragStartOffset = offset;
    lastX = e.clientX; lastT = performance.now(); velocity = 0;
    rail.style.transition = 'none';
  });

  sky.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 6) moved = true;
    let raw = dragStartOffset + dx;
    const min = -(slots.length - 1) * slotWidth;
    if (raw > 0) raw = raw * 0.35;
    if (raw < min) raw = min + (raw - min) * 0.35;
    rail.style.transform = 'translateX(' + raw + 'px)';
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) velocity = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = now;
  });

  function endDrag(e, cancelled){
    if (!dragging) return;
    dragging = false;
    if (activePointerId !== null) { try { sky.releasePointerCapture(activePointerId); } catch(_) {} }

    if (!moved && !cancelled){
      const hub = e.target.closest('.hub-hit');
      if (hub){
        const slotEl = hub.closest('.slot');
        if (slotEl && slotEl.classList.contains('active')){
          launch(slotEl);
          return;
        }
      }
    }

    const dx = (typeof e.clientX === 'number' ? e.clientX : lastX) - dragStartX;
    let target = currentIndex;
    if (Math.abs(dx) > slotWidth * 0.18 || Math.abs(velocity) > 0.5){
      if (dx < 0 || velocity < -0.5) target = currentIndex + 1;
      else if (dx > 0 || velocity > 0.5) target = currentIndex - 1;
    }
    setActive(target, true);
  }

  sky.addEventListener('pointerup', (e) => endDrag(e, false));
  sky.addEventListener('pointercancel', (e) => endDrag(e, true));

  function launch(slotEl){
    const url = slotEl.dataset.url;
    const color = slotEl.dataset.color || '#ffffff';
    flash.style.setProperty('--c', color);
    slotEl.classList.add('warping-slot');
    sky.classList.add('warping');
    setTimeout(() => { window.location.href = url; }, 640);
  }

  dots.forEach((d, i) => d.addEventListener('click', () => setActive(i, true)));

  setActive(0, false);

  // Génération du champ d'étoiles de fond
  const starsLayer = document.getElementById('stars');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 90; i++){
    const s = document.createElement('i');
    s.style.left = (Math.random() * 200 - 50).toFixed(1) + '%';
    s.style.top = (Math.random() * 120 - 10).toFixed(1) + '%';
    const size = (Math.random() * 1.6 + 0.6).toFixed(2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDelay = (Math.random() * 4.5).toFixed(2) + 's';
    s.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
    frag.appendChild(s);
  }
  starsLayer.appendChild(frag);

  // Service worker du shell (inchangé)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Comète — vidage de cache + redémarrage (glisser ou maintenir)
  const comet = document.getElementById('comet');
  let cStartX = 0, cStartY = 0, cStartT = 0, cHoldTimer = null, cTriggered = false, cPointerId = null;

  async function clearCacheAndRestart(){
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches && caches.keys) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) {
      console.warn('Vidage du cache incomplet :', e);
    } finally {
      setTimeout(() => {
        window.location.replace('./index.html?_reset=' + Date.now());
      }, 420);
    }
  }

  function triggerCacheReset(){
    if (cTriggered) return;
    cTriggered = true;
    comet.classList.remove('charging');
    comet.classList.add('launch');
    clearCacheAndRestart();
  }

  comet.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    cTriggered = false;
    cPointerId = e.pointerId;
    try { comet.setPointerCapture(cPointerId); } catch(_) {}
    cStartX = e.clientX; cStartY = e.clientY; cStartT = performance.now();
    comet.classList.add('charging');
    cHoldTimer = setTimeout(triggerCacheReset, 650);
  });

  comet.addEventListener('pointermove', (e) => {
    if (cTriggered) return;
    const dist = Math.hypot(e.clientX - cStartX, e.clientY - cStartY);
    const dt = performance.now() - cStartT;
    if (dist > 36 && dt < 450){
      clearTimeout(cHoldTimer);
      triggerCacheReset();
    }
  });

  function cometRelease(e){
    if (e) e.stopPropagation();
    clearTimeout(cHoldTimer);
    if (!cTriggered) comet.classList.remove('charging');
  }
  comet.addEventListener('pointerup', cometRelease);
  comet.addEventListener('pointercancel', cometRelease);
  comet.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      triggerCacheReset();
    }
  });
})();
</script>

</body>
</html>
