<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portail Duo">
<meta name="theme-color" content="#0d1014">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<!-- Police d'affichage reprise de Muscu (thème "Ardoise & Craie") : réservée
     aux titres/majuscules, le reste reste en police système. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="style.css?v=202609221916280200">
</head>
<body>
<div id="maj-toast" style="display:none; position:fixed; left:50%; bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 20px)); transform:translateX(-50%); z-index:99999; background:var(--card, var(--card-bg, #1c1c1e)); color:var(--text, var(--text-main, #fff)); padding:10px 10px 10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4); align-items:center; gap:12px; white-space:nowrap; border:1px solid var(--border, rgba(255,255,255,.12)); font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
  <span>🔄 Nouvelle version disponible</span>
  <button id="maj-btn" type="button" style="background:var(--accent, var(--primary, #1f8fff)); color:#fff; border:none; border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer;">Actualiser</button>
</div>


  <main>
    <header class="topbar">
      <p class="app-title"><span class="app-title-brand">Portail Duo</span> · Corentin &amp; Lisa</p>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de theme">🌙</button>
    </header>

    <div class="dash-titre">
      <h1 class="big-question">Aujourd'hui</h1>
      <p class="dash-date" id="dash-date"></p>
    </div>

    <!-- Tableau de bord : chaque carte ouvre son app ; les chiffres viennent de `portail/<app>` dans la base
         de Courses (voir README). Tout le texte dynamique est écrit avec textContent, jamais innerHTML :
         ces documents ne sont pas de confiance.
         Lecture d'une carte : 1) nom de l'app + « mis à jour il y a… », 2) l'information clé en GROS,
         3) une phrase d'explication en gris. -->
    <div class="dash">
      <a class="dash-card blue" href="./Muscu/" id="carte-muscu">
        <span class="dash-top">
          <span class="choice-icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4" y="7" width="2" height="10" rx="1"/><rect x="6" y="10.5" width="12" height="3"/><rect x="18" y="7" width="2" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg></span>
          <span class="choice-text">
            <span class="choice-label">Musculation</span>
            <span class="choice-desc dash-maj" id="mu-maj"></span>
          </span>
          <span class="choice-chev">›</span>
        </span>
        <span class="dash-body">
          <span class="dash-label" id="mu-next-label">Prochaine séance</span>
          <span class="dash-value" id="mu-next">—</span>
          <span class="dash-sub" id="mu-next-sub"></span>
          <span class="dash-sep"></span>
          <!-- Phrase motivante du duo (22/09/26) : remplace le compte "X/4 séances", pas
               représentatif d'un rythme qui varie. Calculée par Muscu (portail/muscu.phrase). -->
          <span class="dash-phrase">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#ff8a00" d="M12 1.5c.7 3.6 5.3 6.2 5.3 11.3a5.3 5.3 0 0 1-10.6 0c0-2.2 1-3.6 2-4.8.4 1.5 1.1 2.4 1.9 2.7C10.3 7.4 10.9 4.2 12 1.5Z"/><path fill="#ffd23f" d="M12 12.4c.4 1.6 2.3 2.6 2.3 4.6a2.3 2.3 0 0 1-4.6 0c0-1 .5-1.7 1-2.3.3.6.7 1 1 1.1-.1-1.1.1-2.4.3-3.4Z"/></svg>
            <span id="mu-phrase">—</span>
          </span>
        </span>
      </a>

      <a class="dash-card gold" href="./Budget/" id="carte-budget">
        <span class="dash-top">
          <span class="choice-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a11 11 0 1 0 11 11A11 11 0 0 0 12 1Zm.9 16.1v1.4h-1.8v-1.4c-1.7-.3-3-1.3-3.1-3h1.8c.1.8.7 1.4 2 1.4 1.2 0 2-.6 2-1.5 0-.8-.6-1.3-2.2-1.7-2-.5-3.4-1.3-3.4-3.1 0-1.5 1.2-2.6 2.9-2.9V4.5h1.8v1.4c1.6.3 2.7 1.4 2.8 2.9h-1.8c-.1-.8-.6-1.4-1.7-1.4-1.1 0-1.8.5-1.8 1.3 0 .7.6 1.1 2.1 1.5 2.2.5 3.5 1.4 3.5 3.3 0 1.6-1.2 2.7-3.1 3Z"/></svg></span>
          <span class="choice-text">
            <span class="choice-label">Budget</span>
            <span class="choice-desc dash-maj" id="bu-maj"></span>
          </span>
          <span class="choice-chev">›</span>
        </span>
        <span class="dash-body">
          <span class="dash-label" id="bu-label">Reste à vivre</span>
          <span class="dash-big" id="bu-big"><span class="dash-int" id="bu-int">—</span><span class="dash-unit" id="bu-dec"></span></span>
          <span class="dash-sub" id="bu-days"></span>
          <span class="gauge"><span class="gauge-fill" id="bu-fill"></span></span>
          <span class="dash-meta" id="bu-spent"></span>
        </span>
      </a>

      <a class="dash-card green" href="./Course/" id="carte-courses">
        <span class="dash-top">
          <span class="choice-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="20" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
          <span class="choice-text">
            <span class="choice-label">Courses</span>
            <span class="choice-desc dash-maj" id="co-maj"></span>
          </span>
          <span class="choice-chev">›</span>
        </span>
        <span class="dash-body">
          <span class="dash-label">Sur la liste</span>
          <span class="dash-big"><span class="dash-int" id="co-int">—</span><span class="dash-unit dash-unit-txt" id="co-label"></span></span>
          <span class="dash-label dash-label-2" id="co-chips-label" hidden>Rayons concernés</span>
          <span class="chips" id="co-chips"></span>
        </span>
      </a>
    </div>

    <div class="reload-row">
      <button class="reload-btn" id="hardReload" title="Vider le cache et recharger" aria-label="Vider le cache et recharger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
    <p id="derniere-maj" style="text-align:center; font-size:12px; color:var(--text-dim); margin-top:10px;"></p>
  </main>

<script>
/* Horodatage du dernier déploiement du code (pas des données), mis à jour
   automatiquement par .github/workflows/auto-version.yml. Ne pas supprimer :
   il sert aussi à détecter les nouvelles versions au retour dans l'app. */
const DERNIERE_MAJ = '2026-09-22T19:16:28+02:00';
</script>
<script src="app.js?v=202609221916280200"></script>

</body>
</html>
