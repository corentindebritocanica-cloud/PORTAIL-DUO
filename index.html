<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portail Duo">
<meta name="theme-color" content="#0d1014">
<title>Portail Duo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-192.png">
<!-- Police d'affichage reprise de Muscu (thème "Ardoise & Craie") : réservée
     aux titres/majuscules, le reste reste en police système. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
  /* ==========================================================================
     JETONS DE DESIGN — repris tels quels de Muscu (thème "Ardoise & Craie")
     pour une cohérence visuelle entre le Portail et les 3 apps.
     ========================================================================== */
  :root{
    --bg:#0d1014;
    --card:#161b22;
    --card-2:#1e2530;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.17);

    --text:#e9eff6;
    --text-dim:#8a97a8;

    --blue:#1f8fff;      /* Musculation */
    --blue-dark:#1a5fc4;
    --gold:#ffb800;      /* Budget */
    --gold-dark:#c48e00;
    --green:#12b981;     /* Courses */
    --green-dark:#0d8f64;

    --r-xs:4px;
    --r-sm:10px;
    --r-md:14px;
    --r-lg:18px;
    --r-xl:22px;
    --r-pill:999px;

    --shadow-sm: 0 6px 16px rgba(0,0,0,0.30);
    --shadow: 0 14px 32px rgba(0,0,0,0.44), 0 2px 8px rgba(0,0,0,0.28);
    --shadow-lg: 0 -8px 40px rgba(0,0,0,0.5);

    --t-fast:.14s;
    --t-mid:.22s;

    --f-display: 'Bebas Neue', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* Mode clair (charte UX/UI, memes valeurs que Muscu/Course) */
  html.light-mode{
    --bg:#eef1f5; --card:#ffffff; --card-2:#e7ecf2;
    --border:rgba(23,38,56,0.11); --border-strong:rgba(23,38,56,0.20);
    --text:#131a23; --text-dim:#5f6c7c;
    --shadow-sm: 0 6px 14px rgba(20,30,45,0.08);
    --shadow: 0 14px 28px rgba(20,30,45,0.10), 0 2px 8px rgba(20,30,45,0.05);
    --shadow-lg: 0 -8px 40px rgba(20,30,45,0.14);
  }
  html.light-mode body::before{ display:none; }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ margin:0; min-height:100%; overscroll-behavior:none; }
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }

  /* Poussière de craie, discrète, façon tableau noir essuyé — reprise de Muscu */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(238,240,238,.5), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(238,240,238,.4), transparent),
      radial-gradient(1.5px 1.5px at 32% 64%, rgba(238,240,238,.35), transparent),
      radial-gradient(1px 1px at 91% 47%, rgba(238,240,238,.4), transparent),
      radial-gradient(1.5px 1.5px at 58% 82%, rgba(238,240,238,.3), transparent),
      radial-gradient(1px 1px at 6% 88%, rgba(238,240,238,.35), transparent);
    background-repeat:no-repeat;
  }

  main{ position:relative; z-index:1; display:flex; flex-direction:column; max-width:460px; width:100%; margin:0 auto; }

  .reload-row{ display:flex; justify-content:center; margin-top:18px; }
  .reload-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    box-shadow: var(--shadow-sm);
    transition: transform .5s cubic-bezier(.2,.7,.3,1), color .15s ease, background .15s ease;
  }
  .reload-btn svg{ width:16px; height:16px; }
  .reload-btn:active{ background:var(--card-2); color:var(--text); }
  .reload-btn.spin svg{ transform: rotate(360deg); transition: transform .5s cubic-bezier(.2,.7,.3,1); }

  .app-title{
    font-size:12.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--text-dim); margin:0 0 4px 2px; font-weight:700;
  }
  .app-title-brand{ color:var(--blue); }

  .big-question{
    font-family:var(--f-display); text-transform:uppercase;
    font-size:34px; font-weight:400; letter-spacing:.01em;
    margin:4px 2px 22px 2px; line-height:1.05;
  }

  .doors{ display:flex; flex-direction:column; gap:14px; }

  .big-choice-btn{
    padding:22px 18px; border-radius:var(--r-lg); border:1px solid var(--border);
    background:var(--card); color:var(--text); font-family:inherit;
    display:flex; align-items:center; text-align:left; gap:16px;
    box-shadow: var(--shadow-sm); position:relative;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  .big-choice-btn:active{ transform: scale(0.98); }

  .choice-icon{
    width:46px; height:46px; flex:0 0 auto; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .big-choice-btn.blue .choice-icon{ background:linear-gradient(150deg, var(--blue), var(--blue-dark)); }
  .big-choice-btn.gold .choice-icon{ background:linear-gradient(150deg, var(--gold), var(--gold-dark)); }
  .big-choice-btn.green .choice-icon{ background:linear-gradient(150deg, var(--green), var(--green-dark)); }
  .choice-icon svg{ width:20px; height:20px; }

  .choice-text{ flex:1; min-width:0; }
  .choice-label{
    font-family:var(--f-display); text-transform:uppercase; letter-spacing:.02em;
    font-size:19px; font-weight:400; display:block;
  }
  .choice-desc{
    display:block; font-size:12.5px; color:var(--text-dim); margin-top:2px; font-weight:500;
  }
  .choice-chev{ color:var(--text-dim); font-size:18px; flex:0 0 auto; transition: transform .15s ease; }
  .big-choice-btn:active .choice-chev{ transform: translateX(2px); }

  @media (prefers-reduced-motion: reduce){
    .big-choice-btn{ transition:none; }
  }

  /* Bouton de bascule theme (charte UX/UI) */
  .theme-toggle{
    position:fixed; top:calc(14px + env(safe-area-inset-top, 0px)); right:14px; z-index:25;
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; box-shadow: var(--shadow-sm);
  }
</style>
</head>
<body>
<div id="maj-toast" style="display:none; position:fixed; left:50%; bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 20px)); transform:translateX(-50%); z-index:99999; background:var(--card, var(--card-bg, #1c1c1e)); color:var(--text, var(--text-main, #fff)); padding:10px 10px 10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4); align-items:center; gap:12px; white-space:nowrap; border:1px solid var(--border, rgba(255,255,255,.12)); font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
  <span>🔄 Nouvelle version disponible</span>
  <button id="maj-btn" type="button" style="background:var(--accent, var(--primary, #1f8fff)); color:#fff; border:none; border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer;">Actualiser</button>
</div>


  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Changer de theme">🌙</button>

  <main>
    <p class="app-title"><span class="app-title-brand">Portail Duo</span> · Corentin &amp; Lisa</p>
    <h1 class="big-question">Où va-t-on ?</h1>

    <nav class="doors">
      <button class="big-choice-btn blue" data-url="./Muscu/">
        <span class="choice-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="4" y="7" width="2" height="10" rx="1"/><rect x="6" y="10.5" width="12" height="3"/><rect x="18" y="7" width="2" height="10" rx="1"/><rect x="20" y="9" width="3" height="6" rx="1"/></svg>
        </span>
        <span class="choice-text">
          <span class="choice-label">Musculation</span>
          <span class="choice-desc">Séances, progressions &amp; coach IA</span>
        </span>
        <span class="choice-chev">›</span>
      </button>

      <button class="big-choice-btn gold" data-url="./Budget/">
        <span class="choice-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a11 11 0 1 0 11 11A11 11 0 0 0 12 1Zm.9 16.1v1.4h-1.8v-1.4c-1.7-.3-3-1.3-3.1-3h1.8c.1.8.7 1.4 2 1.4 1.2 0 2-.6 2-1.5 0-.8-.6-1.3-2.2-1.7-2-.5-3.4-1.3-3.4-3.1 0-1.5 1.2-2.6 2.9-2.9V4.5h1.8v1.4c1.6.3 2.7 1.4 2.8 2.9h-1.8c-.1-.8-.6-1.4-1.7-1.4-1.1 0-1.8.5-1.8 1.3 0 .7.6 1.1 2.1 1.5 2.2.5 3.5 1.4 3.5 3.3 0 1.6-1.2 2.7-3.1 3Z"/></svg>
        </span>
        <span class="choice-text">
          <span class="choice-label">Budget</span>
          <span class="choice-desc">Charges, dépenses &amp; provisions</span>
        </span>
        <span class="choice-chev">›</span>
      </button>

      <button class="big-choice-btn green" data-url="./Course/">
        <span class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="20" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </span>
        <span class="choice-text">
          <span class="choice-label">Courses</span>
          <span class="choice-desc">Saisie &amp; liste au supermarché</span>
        </span>
        <span class="choice-chev">›</span>
      </button>
    </nav>

    <div class="reload-row">
      <button class="reload-btn" id="hardReload" title="Vider le cache et recharger" aria-label="Vider le cache et recharger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
    <p id="derniere-maj" style="text-align:center; font-size:12px; color:var(--text-dim); margin-top:10px;"></p>
  </main>

<script>
  /* ============================================================
     THEME CLAIR / SOMBRE (charte UX/UI)
     ============================================================ */
  (function(){
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const stocke = localStorage.getItem('portail-theme');
    function appliquer(theme){
      root.classList.toggle('light-mode', theme === 'light');
      btn.textContent = theme === 'light' ? '☀️' : '🌙';
    }
    appliquer(stocke === 'light' ? 'light' : 'dark');
    btn.addEventListener('click', ()=>{
      const nouveauTheme = root.classList.contains('light-mode') ? 'dark' : 'light';
      localStorage.setItem('portail-theme', nouveauTheme);
      appliquer(nouveauTheme);
    });
  })();

  document.querySelectorAll('.big-choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const url = btn.getAttribute('data-url');
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => { window.location.href = url; }, 120);
    });
  });

  document.getElementById('hardReload').addEventListener('click', async (e) => {
    // Confirmation ajoutée le 18/09/2026 : ce bouton est destructif pour le
    // hors-ligne du Portail (il faudra le recharger en ligne une fois pour
    // qu'il redevienne disponible sans réseau) — mieux vaut valider le clic.
    const ok = window.confirm('Vider le cache du Portail et recharger ?\n\nLe Portail ne sera plus disponible hors-ligne tant qu\'il n\'aura pas été rouvert au moins une fois avec une connexion.');
    if (!ok) return;

    const btn = e.currentTarget;
    btn.classList.add('spin');
    try {
      // Correctif 18/09/2026 : caches.keys() et getRegistrations() renvoient
      // TOUT ce qui existe sur le domaine, pas seulement ce qui appartient au
      // Portail. Sans filtre, ce bouton supprimait aussi le cache et le
      // Service Worker de Course/Muscu/Budget — corrigé en limitant chaque
      // suppression à ce qui appartient réellement au Portail.
      if ('caches' in window) {
        const CACHE_PREFIX = 'portail-duo-shell-';
        const names = await caches.keys();
        await Promise.all(
          names.filter(n => n.startsWith(CACHE_PREFIX)).map(n => caches.delete(n))
        );
      }
      if ('serviceWorker' in navigator) {
        const scopePortail = new URL('./', window.location.href).href;
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          regs.filter(r => r.scope === scopePortail).map(r => r.unregister())
        );
      }
    } catch (err) {
      // silencieux : on recharge quand même
    }
    window.location.href = window.location.pathname + '?_r=' + Date.now();
  });

  /* Service worker (18/09/26) : le fichier sw.js existait déjà à la racine
     du dépôt mais n'avait jamais été enregistré depuis cette page — corrigé
     ici. Chemin ET scope volontairement relatifs ('sw.js', './') plutôt
     qu'absolus, comme dans /Muscu/, /Course/ et désormais /Budget/. */
  /* Horodatage du dernier deploiement de code (pas des donnees) : a mettre
     a jour manuellement a chaque commit sur cette app. Complement du
     bandeau "Nouvelle version disponible". */
  const DERNIERE_MAJ = '2026-09-20T22:05:58+02:00';
  function formaterDerniereMaj(iso){
    const d = new Date(iso);
    const jour = String(d.getDate()).padStart(2,'0');
    const mois = String(d.getMonth()+1).padStart(2,'0');
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    return `${jour}/${mois}/${d.getFullYear()} à ${h}h${m}`;
  }
  document.getElementById('derniere-maj').textContent = 'Dernière mise à jour du code : ' + formaterDerniereMaj(DERNIERE_MAJ);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' }).then((reg) => {
        const afficherToastMaj = () => {
          const t = document.getElementById('maj-toast');
          if (t) t.style.display = 'flex';
        };
        if (reg.waiting) afficherToastMaj();
        reg.addEventListener('updatefound', () => {
          const nv = reg.installing;
          if (!nv) return;
          nv.addEventListener('statechange', () => {
            if (nv.state === 'installed' && navigator.serviceWorker.controller) {
              afficherToastMaj();
            }
          });
        });
      }).catch((err) => console.warn('[sw] enregistrement échoué :', err));
    });
    const btnMaj = document.getElementById('maj-btn');
    if (btnMaj) btnMaj.addEventListener('click', () => window.location.reload());
  }
/* Vérification de version au retour dans l'app (20/09/2026).
   Sur iPhone, une PWA remise au premier plan n'est pas rechargée : elle garde
   l'ancien code en mémoire. Au retour, on relit index.html sur le serveur et on
   compare son horodatage de déploiement avec celui du code en cours. Si une
   version plus récente existe : rechargement automatique, sauf si l'utilisateur
   saisit du texte ou a une fenêtre ouverte (alors : bandeau « Actualiser »). */
(function(){
  if (typeof DERNIERE_MAJ === 'undefined' || !('fetch' in window)) return;
  let dernierControle = 0;
  const estVisible = (el) => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const utilisateurOccupe = () => {
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return true;
    return Array.from(document.querySelectorAll('.overlay-popup, .confirm-overlay, .modal-overlay, .login-overlay, .modal-fond')).some(estVisible);
  };
  const verifierVersion = async () => {
    if (Date.now() - dernierControle < 30000) return;
    dernierControle = Date.now();
    try {
      const rep = await fetch('index.html', { cache: 'no-store' });
      if (!rep.ok) return;
      const m = (await rep.text()).match(/DERNIERE_MAJ\s*=\s*'([^']+)'/);
      if (!m || m[1] === DERNIERE_MAJ) return;
      if (utilisateurOccupe()) {
        const t = document.getElementById('maj-toast');
        if (t) t.style.display = 'flex';
      } else {
        window.location.reload();
      }
    } catch (e) { /* hors ligne : on garde la version en cours */ }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') verifierVersion();
  });
})();
</script>

</body>
</html>
