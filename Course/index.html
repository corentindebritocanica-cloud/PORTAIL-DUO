function lancerSeedSiVide(){
  colRayons.limit(1).get().then(snap=>{
    if(!snap.empty) return; // déjà initialisé, on ne touche à rien
    const batch = db.batch();
    const nomVersId = {};
    RAYONS_SEED.forEach(nom=>{
      const ref = colRayons.doc();
      nomVersId[nom] = ref.id;
      batch.set(ref, { nom });
    });
    PRODUITS_SEED.forEach(([nom, rayonNom, quantite])=>{
      const ref = colProduits.doc();
      batch.set(ref, {
        nom, quantite: quantite||"", rayonId: nomVersId[rayonNom] || "",
        aAcheter:false, achete:false, compteur:0
      });
    });
    batch.commit();
  });
}

   ============================================================ */
function demarrer(){
  authListen(user=>{
    if(user){
      lancerSeedSiVide();
      colProduits.onSnapshot(snap=>{
        const obj = {};
        snap.forEach(doc=>{ obj[doc.id] = doc.data(); });
        state.produits = obj;
        render();
      }, err=> console.error("Erreur lecture produits :", err));
      colRayons.onSnapshot(snap=>{
        const obj = {};
        snap.forEach(doc=>{ obj[doc.id] = doc.data().nom; });
        state.rayons = obj;
        render();
      }, err=> console.error("Erreur lecture rayons :", err));
      document.getElementById('splash').style.display='none';
      document.getElementById('ecran-login').style.display='none';
      if(state.profil){
        afficherApp();
      }else{
        document.getElementById('ecran-profil').style.display='flex';
      }
    }else{
      document.getElementById('splash').style.display='none';
      document.getElementById('ecran-login').style.display='flex';
    }
  });
}

document.getElementById('btn-connexion').addEventListener('click', ()=>{
  const email = document.getElementById('input-email-login').value.trim();
  const password = document.getElementById('input-password-login').value;
  const zoneErreur = document.getElementById('erreur-login');
  zoneErreur.textContent = '';
  if(!email || !password){
    zoneErreur.textContent = "Remplis les deux champs.";
    return;
  }
  auth.signInWithEmailAndPassword(email, password).catch(err=>{
    console.error("Erreur connexion :", err);
    zoneErreur.textContent = "Email ou mot de passe incorrect.";
  });
});

function afficherApp(){
  document.getElementById('ecran-profil').style.display='none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('badge-profil').textContent = state.profil;
}

document.querySelectorAll('.btn-profil').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.profil = btn.dataset.profil;
    localStorage.setItem('courses_profil', state.profil);
    afficherApp();
    render();
  });
});

/* ============================================================
   NAVIGATION ONGLETS
   ============================================================ */
document.querySelectorAll('.onglet-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.onglet = btn.dataset.onglet;
    document.querySelectorAll('.onglet-btn').forEach(b=>b.classList.toggle('actif', b===btn));
    document.getElementById('vue-saisie').style.display = state.onglet==='saisie' ? 'block':'none';
    document.getElementById('vue-course').style.display = state.onglet==='course' ? 'block':'none';
    document.getElementById('titre-onglet').textContent = state.onglet==='saisie' ? 'Saisie' : 'Course';
    document.getElementById('btn-ouvrir-ajout').style.display = state.onglet==='saisie' ? 'block':'none';
    document.getElementById('btn-course-terminee').style.display = state.onglet==='course' ? 'block':'none';
    if(state.onglet==='course') renderCourse();
    vibrer(8);
  });
});

const inputRecherche = document.getElementById('recherche-saisie');
const btnEffacerRecherche = document.getElementById('btn-effacer-recherche');

inputRecherche.addEventListener('input', e=>{
  state.recherche = e.target.value.trim().toLowerCase();
  btnEffacerRecherche.style.display = e.target.value ? 'flex' : 'none';
  renderSaisie();
});

btnEffacerRecherche.addEventListener('click', ()=>{
  inputRecherche.value = '';
  state.recherche = '';
  btnEffacerRecherche.style.display = 'none';
  renderSaisie();
  inputRecherche.focus();
  vibrer(8);
});


/* ============================================================
   ACTIONS PRODUITS
   ============================================================ */
function toggleAcheter(id){
  const p = state.produits[id];
  if(!p) return;
  const nouveauStatut = !p.aAcheter;
  const updates = { aAcheter: nouveauStatut };
  if(nouveauStatut){
    updates.compteur = (p.compteur||0) + 1;
  }
  colProduits.doc(id).update(updates);
  vibrer(12);
}

function toggleAcheteCourse(id){
  const p = state.produits[id];
  if(!p) return;
  colProduits.doc(id).update({ achete: !p.achete });
  vibrer(15);
}

function terminerCourse(){
  const aEffacer = Object.entries(state.produits).filter(([id,p])=> p.aAcheter && p.achete);
  if(aEffacer.length===0) return;
  const batch = db.batch();
  aEffacer.forEach(([id])=>{
    batch.update(colProduits.doc(id), { aAcheter:false, achete:false });
  });
  batch.commit();
  vibrer(20);
}

function updateQuantite(id, val){
  colProduits.doc(id).update({ quantite: val });
}

/* ============================================================
   RENDU
   ============================================================ */
function iconeCheck(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function render(){
  renderSaisie();
  renderCourse();
}

function renderSaisie(){
  const cont = document.getElementById('liste-saisie');
  let items = Object.entries(state.produits);
  if(state.recherche){
    items = items.filter(([id,p])=> p.nom.toLowerCase().includes(state.recherche));
  }
  // Tri : compteur décroissant, puis alphabétique
  items.sort((a,b)=>{
    const diff = (b[1].compteur||0) - (a[1].compteur||0);
    if(diff!==0) return diff;
    return a[1].nom.localeCompare(b[1].nom);
  });

  if(items.length===0){
    cont.innerHTML = `<div class="empty-state"><div class="display">Rien trouvé</div><p>Essaie un autre mot, ou ajoute le produit avec le bouton +.</p></div>`;
    return;
  }

  cont.innerHTML = items.map(([id,p])=>{
    const rayonNom = state.rayons[p.rayonId] || 'Sans rayon';
    return `
    <div class="carte-produit">
      <div class="checkbox ${p.aAcheter?'checked':''}" onclick="toggleAcheter('${id}')">${iconeCheck()}</div>
      <div class="infos-produit" onclick="ouvrirModaleRayon('${id}')">
        <div class="nom-produit">${escapeHtml(p.nom)}</div>
        <div class="rayon-tag">${escapeHtml(rayonNom)}</div>
      </div>
      <input class="quantite-input" placeholder="Qté" value="${escapeAttr(p.quantite||'')}"
        onchange="updateQuantite('${id}', this.value)">
      <button class="btn-crayon" onclick="ouvrirModaleEdition('${id}')" aria-label="Modifier le produit">✏️</button>
    </div>`;
  }).join('');
}

function renderCourse(){
  const cont = document.getElementById('liste-course');
  const items = Object.entries(state.produits).filter(([id,p])=>p.aAcheter);

  document.getElementById('compteur-course').textContent = items.length;

  if(items.length===0){
    cont.innerHTML = `<div class="empty-state"><div class="display">Rien à acheter</div><p>Coche des produits dans l'onglet Saisie pour les faire apparaître ici.</p></div>`;
    return;
  }

  // Groupement par rayon
  const groupes = {};
  items.forEach(([id,p])=>{
    const rayonNom = state.rayons[p.rayonId] || 'Sans rayon';
    if(!groupes[rayonNom]) groupes[rayonNom]=[];
    groupes[rayonNom].push([id,p]);
  });
  const rayonsTries = Object.keys(groupes).sort((a,b)=>a.localeCompare(b));

  cont.innerHTML = rayonsTries.map(rayonNom=>{
    const produitsRayon = groupes[rayonNom].sort((a,b)=>a[1].nom.localeCompare(b[1].nom));
    return `
    <div class="section-rayon">
      <h2 class="display">${escapeHtml(rayonNom)}</h2>
      ${produitsRayon.map(([id,p])=>`
        <div class="carte-produit">
          <div class="checkbox mode-course ${p.achete?'checked':''}" onclick="toggleAcheteCourse('${id}')">${iconeCheck()}</div>
          <div class="infos-produit">
            <div class="nom-produit">${escapeHtml(p.nom)}</div>
            ${p.quantite ? `<div class="rayon-tag">${escapeHtml(p.quantite)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================
   MODALE : AJOUTER / MODIFIER UN PRODUIT
   ============================================================ */
const overlayAjout = document.getElementById('overlay-ajout');
const titreModaleAjout = document.getElementById('titre-modale-ajout');
const btnValiderAjout = document.getElementById('btn-valider-ajout');
let idEnEditionAjout = null; // null = mode création, sinon id du produit en cours de modification

document.getElementById('btn-ouvrir-ajout').addEventListener('click', ()=>{
  idEnEditionAjout = null;
  titreModaleAjout.textContent = 'Ajouter un produit';
  btnValiderAjout.textContent = 'Ajouter';
  document.getElementById('input-nom-produit').value='';
  document.getElementById('input-quantite-produit').value='';
  document.getElementById('input-nouveau-rayon').value='';
  document.getElementById('champ-nouveau-rayon').style.display='none';
  remplirSelectRayons('select-rayon-produit', true);
  overlayAjout.classList.add('visible');
});

function ouvrirModaleEdition(id){
  const p = state.produits[id];
  if(!p) return;
  idEnEditionAjout = id;
  titreModaleAjout.textContent = 'Modifier le produit';
  btnValiderAjout.textContent = 'Enregistrer';
  document.getElementById('input-nom-produit').value = p.nom || '';
  document.getElementById('input-quantite-produit').value = p.quantite || '';
  document.getElementById('input-nouveau-rayon').value = '';
  document.getElementById('champ-nouveau-rayon').style.display='none';
  remplirSelectRayons('select-rayon-produit', true, p.rayonId);
  overlayAjout.classList.add('visible');
}

document.getElementById('btn-annuler-ajout').addEventListener('click', ()=> overlayAjout.classList.remove('visible'));
overlayAjout.addEventListener('click', e=>{ if(e.target===overlayAjout) overlayAjout.classList.remove('visible'); });

document.getElementById('select-rayon-produit').addEventListener('change', e=>{
  document.getElementById('champ-nouveau-rayon').style.display = e.target.value==='__nouveau__' ? 'block':'none';
});

btnValiderAjout.addEventListener('click', async ()=>{
  const nom = document.getElementById('input-nom-produit').value.trim();
  const quantite = document.getElementById('input-quantite-produit').value.trim();
  if(!nom){ return; }

  let rayonId = document.getElementById('select-rayon-produit').value;
  if(rayonId==='__nouveau__'){
    const nomRayon = document.getElementById('input-nouveau-rayon').value.trim();
    if(!nomRayon){ return; }
    const ref = colRayons.doc();
    await ref.set({ nom: nomRayon });
    rayonId = ref.id;
  }

  if(idEnEditionAjout){
    await colProduits.doc(idEnEditionAjout).update({ nom, quantite, rayonId });
  }else{
    await colProduits.add({
      nom, quantite, rayonId, aAcheter:true, achete:false, compteur:1
    });
  }
  overlayAjout.classList.remove('visible');
  vibrer(15);
});

function remplirSelectRayons(selectId, avecOptionNouveau, rayonSelectionne){
  const sel = document.getElementById(selectId);
  const rayonsTries = Object.entries(state.rayons).sort((a,b)=>a[1].localeCompare(b[1]));
  let html = rayonsTries.map(([id,nom])=>`<option value="${id}">${escapeHtml(nom)}</option>`).join('');
  if(avecOptionNouveau){
    html += `<option value="__nouveau__">+ Nouveau rayon…</option>`;
  }
  sel.innerHTML = html;
  if(rayonSelectionne) sel.value = rayonSelectionne;
}

/* ============================================================
   MODALE : CHANGER LE RAYON D'UN PRODUIT
   ============================================================ */
const overlayRayon = document.getElementById('overlay-rayon');
let produitEnEdition = null;

function ouvrirModaleRayon(id){
  produitEnEdition = id;
  const p = state.produits[id];
  remplirSelectRayons('select-rayon-existant', false, p.rayonId);
  overlayRayon.classList.add('visible');
}
document.getElementById('btn-annuler-rayon').addEventListener('click', ()=> overlayRayon.classList.remove('visible'));
overlayRayon.addEventListener('click', e=>{ if(e.target===overlayRayon) overlayRayon.classList.remove('visible'); });
document.getElementById('btn-valider-rayon').addEventListener('click', ()=>{
  const rayonId = document.getElementById('select-rayon-existant').value;
  colProduits.doc(produitEnEdition).update({ rayonId });
  overlayRayon.classList.remove('visible');
});

/* ============================================================
   BOOT
   ============================================================ */
demarrer();
</script>
</body>
</html>
