/* Wrappers (évite les conflits de noms globaux, cf. Budget L&C) */
function dbRef(path){ return db.ref(path); }
function dbSet(path, val){ return dbRef(path).set(val); }
function dbUpdate(path, val){ return dbRef(path).update(val); }
function dbPush(path, val){ return dbRef(path).push(val); }
function dbOn(path, cb){ dbRef(path).on('value', cb); }
function authListen(cb){ auth.onAuthStateChanged(cb); }

function vibrer(ms){ if(navigator.vibrate) navigator.vibrate(ms || 12); }

/* ============================================================
   HORS LIGNE — cache local + file d'attente d'écritures
   Principe : chaque action modifie l'état local + le cache
   immédiatement (affichage instantané, même sans réseau), puis
   est ajoutée à une file persistée dans localStorage. La file est
   rejouée dès que Firebase signale une connexion active
   (.info/connected), donc rien n'est perdu même si l'app est
   fermée avant le retour du réseau.
   ============================================================ */
const CLE_CACHE_PRODUITS = 'courses_cache_produits';
const CLE_CACHE_RAYONS = 'courses_cache_rayons';
const CLE_QUEUE = 'courses_queue';

function chargerCache(cle){
  try{ return JSON.parse(localStorage.getItem(cle)) || {}; }catch(e){ return {}; }
}
function sauvegarderCache(cle, val){
  try{ localStorage.setItem(cle, JSON.stringify(val)); }catch(e){}
}
function lireQueue(){
  try{ return JSON.parse(localStorage.getItem(CLE_QUEUE)) || []; }catch(e){ return []; }
}
function ecrireQueue(q){
  try{ localStorage.setItem(CLE_QUEUE, JSON.stringify(q)); }catch(e){}
  majBadgeHorsLigne();
}
function ajouterOperation(op){
  const q = lireQueue();
  op.id = 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  q.push(op);
  ecrireQueue(q);
  traiterQueue();
}

let connecteFirebase = false;
let traitementEnCours = false;

async function traiterQueue(){
  if(traitementEnCours || !connecteFirebase) return;
  traitementEnCours = true;
  let q = lireQueue();
  while(q.length > 0){
    const op = q[0];
    try{
      await executerOperation(op);
      q.shift();
      ecrireQueue(q);
    }catch(e){
      console.error('Échec envoi opération (nouvelle tentative plus tard) :', op.type, e);
      break;
    }
  }
  traitementEnCours = false;
}

async function executerOperation(op){
  switch(op.type){
    case 'toggleAcheter': {
      const updates = { aAcheter: op.aAcheter };
      if(op.aAcheter) updates.compteur = op.compteur;
      await dbRef('courses/produits/'+op.id).update(updates);
      break;
    }
    case 'toggleAcheteCourse':
      await dbRef('courses/produits/'+op.id).update({ achete: op.achete });
      break;
    case 'updateQuantite':
      await dbRef('courses/produits/'+op.id).update({ quantite: op.val });
      break;
    case 'terminerCourse': {
      const updates = {};
      op.ids.forEach(id=>{
        updates['courses/produits/'+id+'/aAcheter'] = false;
        updates['courses/produits/'+id+'/achete'] = false;
      });
      await db.ref().update(updates);
      break;
    }
    case 'changerRayon':
      await dbRef('courses/produits/'+op.id).update({ rayonId: op.rayonId });
      break;
    case 'ajouterRayon':
      await dbSet('courses/rayons/'+op.rayonId, op.nom);
      break;
    case 'ajouterProduit':
      await dbSet('courses/produits/'+op.produitId, op.donnees);
      break;
  }
}

function majBadgeHorsLigne(){
  const badge = document.getElementById('badge-hors-ligne');
  if(!badge) return;
  const q = lireQueue();
  if(!connecteFirebase){
    badge.style.display = 'block';
    badge.textContent = q.length>0 ? ('Hors ligne · '+q.length+' en attente d\'envoi') : 'Hors ligne';
  } else if(q.length>0){
    badge.style.display = 'block';
    badge.textContent = 'Envoi en cours… ('+q.length+')';
  } else {
    badge.style.display = 'none';
  }
}

function lancerSeedSiVide(){
  dbRef('courses/rayons').once('value').then(snap=>{
    if(snap.exists()) return; // déjà initialisé, on ne touche à rien
    const rayonsObj = {};
    RAYONS_SEED.forEach(nom=>{
      const id = dbPush('courses/rayons').key;
      rayonsObj[id] = nom;
    });
    dbSet('courses/rayons', rayonsObj).then(()=>{
      // reconstruire une map nom->id pour lier les produits
      const nomVersId = {};
      Object.entries(rayonsObj).forEach(([id,nom])=> nomVersId[nom]=id);
      const produitsObj = {};
      PRODUITS_SEED.forEach(([nom, rayonNom, quantite])=>{
        const id = dbPush('courses/produits').key;
        produitsObj[id] = {
          nom, quantite: quantite||"", rayonId: nomVersId[rayonNom] || "",
          aAcheter:false, compteur:0
        };
      });
      dbSet('courses/produits', produitsObj);
    });
  }).catch(e=> console.warn('Vérification du seed impossible (hors ligne ?) :', e));
}

/* ============================================================
   AUTH + CHARGEMENT
   ============================================================ */
function demarrer(){
  // Cache local chargé immédiatement : affichage possible même sans réseau du tout
  state.produits = chargerCache(CLE_CACHE_PRODUITS);
  state.rayons = chargerCache(CLE_CACHE_RAYONS);

  // Suivi de la connexion réelle à Firebase (fiable même quand navigator.onLine ment)
  db.ref('.info/connected').on('value', snap=>{
    connecteFirebase = snap.val() === true;
    majBadgeHorsLigne();
    if(connecteFirebase) traiterQueue();
  });
  window.addEventListener('online', traiterQueue);

  authListen(user=>{
    if(user){
      lancerSeedSiVide();
      dbOn('courses/produits', snap=>{
        state.produits = snap.val() || {};
        sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
        render();
      });
      dbOn('courses/rayons', snap=>{
        state.rayons = snap.val() || {};
        sauvegarderCache(CLE_CACHE_RAYONS, state.rayons);
        render();
      });
      document.getElementById('splash').style.display='none';
      document.getElementById('ecran-login').style.display='none';
      if(state.profil){
        afficherApp();
        render();
      }else{
        document.getElementById('ecran-profil').style.display='flex';
      }
    }else{
      document.getElementById('splash').style.display='none';
      document.getElementById('ecran-login').style.display='flex';
    }
  });

  // Filet de sécurité : si Firebase Auth ne répond pas (vraiment aucun réseau
  // et session pas encore restaurée), on affiche quand même le cache local.
  setTimeout(()=>{
    const splash = document.getElementById('splash');
    if(splash && splash.style.display!=='none' && Object.keys(state.produits).length>0){
      splash.style.display='none';
      if(state.profil){
        afficherApp();
        render();
      }else{
        document.getElementById('ecran-profil').style.display='flex';
      }
    }
  }, 3000);
}

  auth.signInWithEmailAndPassword(email, password).catch(err=>{
    console.error("Erreur connexion :", err);
    zoneErreur.textContent = "Email ou mot de passe incorrect.";
  });
});

/* ============================================================
   ACTIONS PRODUITS
   Chaque action : (1) modifie l'état local, (2) sauvegarde le
   cache, (3) réaffiche tout de suite, (4) empile l'écriture dans
   la file d'attente hors-ligne.
   ============================================================ */
function toggleAcheter(id){
  const p = state.produits[id];
  if(!p) return;
  const nouveauStatut = !p.aAcheter;
  p.aAcheter = nouveauStatut;
  if(nouveauStatut) p.compteur = (p.compteur||0) + 1;
  sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
  render();
  ajouterOperation({type:'toggleAcheter', id, aAcheter:nouveauStatut, compteur:p.compteur});
  vibrer(12);
}

function marquerAchete(id){
  const p = state.produits[id];
  if(!p) return;
  p.achete = !p.achete;
  sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
  render();
  ajouterOperation({type:'toggleAcheteCourse', id, achete:p.achete});
  vibrer(15);
}

function terminerCourse(){
  const aEffacer = Object.entries(state.produits).filter(([id,p])=> p.aAcheter && p.achete);
  if(aEffacer.length===0) return;
  const ids = aEffacer.map(([id])=>id);
  ids.forEach(id=>{
    state.produits[id].aAcheter = false;
    state.produits[id].achete = false;
  });
  sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
  render();
  ajouterOperation({type:'terminerCourse', ids});
  vibrer(20);
}

function updateQuantite(id, val){
  const p = state.produits[id];
  if(!p) return;
  p.quantite = val;
  sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
  ajouterOperation({type:'updateQuantite', id, val});
}

/* ============================================================
   RENDU
   ============================================================ */
function iconeCheck(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function render(){
  renderSaisie();
  renderCourse();
}

function renderSaisie(){
  const cont = document.getElementById('liste-saisie');
  try{
    // Défensif : on ignore silencieusement toute entrée corrompue (sans nom)
    // plutôt que de planter tout l'affichage.
    let items = Object.entries(state.produits).filter(([id,p])=> p && typeof p.nom === 'string');
    const nbIgnores = Object.keys(state.produits).length - items.length;
    if(nbIgnores>0) console.warn(nbIgnores+' produit(s) ignoré(s) car sans nom valide.');

    if(state.recherche){
      items = items.filter(([id,p])=> p.nom.toLowerCase().includes(state.recherche));
    }
    // Tri : compteur décroissant, puis alphabétique
    items.sort((a,b)=>{
      const diff = (b[1].compteur||0) - (a[1].compteur||0);
      if(diff!==0) return diff;
      return a[1].nom.localeCompare(b[1].nom);
    });

    if(items.length===0){
      cont.innerHTML = `<div class="empty-state"><div class="display">Rien trouvé</div><p>Essaie un autre mot, ou ajoute le produit avec le bouton +.</p></div>`;
      return;
    }

    cont.innerHTML = items.map(([id,p])=>{
      const rayonNom = state.rayons[p.rayonId] || 'Sans rayon';
      return `
      <div class="carte-produit">
        <div class="checkbox ${p.aAcheter?'checked':''}" onclick="toggleAcheter('${id}')">${iconeCheck()}</div>
        <div class="infos-produit" onclick="ouvrirModaleRayon('${id}')">
          <div class="nom-produit">${escapeHtml(p.nom)}</div>
          <div class="rayon-tag">${escapeHtml(rayonNom)}</div>
        </div>
        <input class="quantite-input" placeholder="Qté" value="${escapeAttr(p.quantite||'')}"
          onchange="updateQuantite('${id}', this.value)">
      </div>`;
    }).join('');
  }catch(e){
    console.error('Erreur renderSaisie :', e);
    cont.innerHTML = `<div class="empty-state"><div class="display">Erreur d'affichage</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

function renderCourse(){
  const cont = document.getElementById('liste-course');
  try{
    const items = Object.entries(state.produits).filter(([id,p])=> p && typeof p.nom === 'string' && p.aAcheter);

    document.getElementById('compteur-course').textContent = items.length;

    const nbAchetes = items.filter(([id,p])=>p.achete).length;
    document.getElementById('btn-course-terminee').style.display = nbAchetes>0 ? 'block' : 'none';

    if(items.length===0){
      cont.innerHTML = `<div class="empty-state"><div class="display">Rien à acheter</div><p>Coche des produits dans l'onglet Saisie pour les faire apparaître ici.</p></div>`;
      return;
    }

    // Groupement par rayon
    const groupes = {};
    items.forEach(([id,p])=>{
      const rayonNom = state.rayons[p.rayonId] || 'Sans rayon';
      if(!groupes[rayonNom]) groupes[rayonNom]=[];
      groupes[rayonNom].push([id,p]);
    });
    const rayonsTries = Object.keys(groupes).sort((a,b)=>a.localeCompare(b));

    cont.innerHTML = rayonsTries.map(rayonNom=>{
      const produitsRayon = groupes[rayonNom].sort((a,b)=>a[1].nom.localeCompare(b[1].nom));
      return `
      <div class="section-rayon">
        <h2 class="display">${escapeHtml(rayonNom)}</h2>
        ${produitsRayon.map(([id,p])=>`
          <div class="carte-produit">
            <div class="checkbox mode-course ${p.achete?'checked':''}" onclick="marquerAchete('${id}')">${iconeCheck()}</div>
            <div class="infos-produit">
              <div class="nom-produit ${p.achete?'achete':''}">${escapeHtml(p.nom)}</div>
              ${p.quantite ? `<div class="rayon-tag">${escapeHtml(p.quantite)}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>`;
    }).join('');
  }catch(e){
    console.error('Erreur renderCourse :', e);
    cont.innerHTML = `<div class="empty-state"><div class="display">Erreur d'affichage</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================
   MODALE : AJOUTER UN PRODUIT
   ============================================================ */
const overlayAjout = document.getElementById('overlay-ajout');

document.getElementById('btn-ouvrir-ajout').addEventListener('click', ()=>{
  document.getElementById('input-nom-produit').value='';
  document.getElementById('input-quantite-produit').value='';
  document.getElementById('input-nouveau-rayon').value='';
  document.getElementById('champ-nouveau-rayon').style.display='none';
  remplirSelectRayons('select-rayon-produit', true);
  overlayAjout.classList.add('visible');
});
document.getElementById('btn-annuler-ajout').addEventListener('click', ()=> overlayAjout.classList.remove('visible'));
overlayAjout.addEventListener('click', e=>{ if(e.target===overlayAjout) overlayAjout.classList.remove('visible'); });

document.getElementById('select-rayon-produit').addEventListener('change', e=>{
  document.getElementById('champ-nouveau-rayon').style.display = e.target.value==='__nouveau__' ? 'block':'none';
});

document.getElementById('btn-valider-ajout').addEventListener('click', ()=>{
  const nom = document.getElementById('input-nom-produit').value.trim();
  const quantite = document.getElementById('input-quantite-produit').value.trim();
  if(!nom){ return; }

  // dbRef(...).push().key génère un identifiant valide localement,
  // sans réseau : on peut donc créer produit (et rayon) hors ligne.
  let rayonId = document.getElementById('select-rayon-produit').value;
  if(rayonId==='__nouveau__'){
    const nomRayon = document.getElementById('input-nouveau-rayon').value.trim();
    if(!nomRayon){ return; }
    rayonId = dbRef('courses/rayons').push().key;
    state.rayons[rayonId] = nomRayon;
    ajouterOperation({type:'ajouterRayon', rayonId, nom: nomRayon});
  }

  const produitId = dbRef('courses/produits').push().key;
  const donnees = { nom, quantite, rayonId, aAcheter:true, compteur:1 };
  state.produits[produitId] = donnees;

  sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
  sauvegarderCache(CLE_CACHE_RAYONS, state.rayons);
  render();
  ajouterOperation({type:'ajouterProduit', produitId, donnees});

  overlayAjout.classList.remove('visible');
  vibrer(15);
});

function remplirSelectRayons(selectId, avecOptionNouveau, rayonSelectionne){
  const sel = document.getElementById(selectId);
  const rayonsTries = Object.entries(state.rayons).sort((a,b)=>a[1].localeCompare(b[1]));
  let html = rayonsTries.map(([id,nom])=>`<option value="${id}">${escapeHtml(nom)}</option>`).join('');
  if(avecOptionNouveau){
    html += `<option value="__nouveau__">+ Nouveau rayon…</option>`;
  }
  sel.innerHTML = html;
  if(rayonSelectionne) sel.value = rayonSelectionne;
}

/* ============================================================
   MODALE : CHANGER LE RAYON D'UN PRODUIT
   ============================================================ */
const overlayRayon = document.getElementById('overlay-rayon');
let produitEnEdition = null;

function ouvrirModaleRayon(id){
  produitEnEdition = id;
  const p = state.produits[id];
  remplirSelectRayons('select-rayon-existant', false, p.rayonId);
  overlayRayon.classList.add('visible');
}
document.getElementById('btn-annuler-rayon').addEventListener('click', ()=> overlayRayon.classList.remove('visible'));
overlayRayon.addEventListener('click', e=>{ if(e.target===overlayRayon) overlayRayon.classList.remove('visible'); });
document.getElementById('btn-valider-rayon').addEventListener('click', ()=>{
  const rayonId = document.getElementById('select-rayon-existant').value;
  const p = state.produits[produitEnEdition];
  if(p){
    p.rayonId = rayonId;
    sauvegarderCache(CLE_CACHE_PRODUITS, state.produits);
    render();
    ajouterOperation({type:'changerRayon', id: produitEnEdition, rayonId});
  }
  overlayRayon.classList.remove('visible');
});

    navigator.serviceWorker.register('sw.js').catch(e=> console.warn('Service worker non enregistré :', e));

demarrer();
