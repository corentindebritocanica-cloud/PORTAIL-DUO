name: Auto-version (DERNIERE_MAJ + cache du Service Worker)

# À chaque push sur main qui modifie index.html, style.css ou app.js d'une app,
# met à jour automatiquement, pour CETTE app uniquement :
#   - DERNIERE_MAJ dans son index.html (heure de Paris, format ISO)
#   - les URLs versionnées style.css?v=… et app.js?v=… dans son index.html
#     (chiffres de DERNIERE_MAJ : garantit qu'aucun cache ne ressert l'ancien code)
#   - CACHE_NAME dans son sw.js (préfixe de l'app + "r" + numéro d'exécution)
# Lancement manuel (onglet Actions > Run workflow) : met à jour les 4 apps,
# ce qui force le rafraîchissement de toutes les installations.
# Si une étape de contrôle échoue, l'exécution est marquée en rouge dans l'onglet Actions.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'Budget/index.html'
      - 'Budget/style.css'
      - 'Budget/app.js'
      - 'Course/index.html'
      - 'Course/style.css'
      - 'Course/app.js'
      - 'Muscu/index.html'
      - 'Muscu/style.css'
      - 'Muscu/app.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump:
    # Un commit poussé par ce robot ne relance jamais le workflow
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mettre à jour DERNIERE_MAJ et CACHE_NAME
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          NOW=$(TZ=Europe/Paris date +%Y-%m-%dT%H:%M:%S%:z)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            CHANGED=$'index.html\nBudget/index.html\nCourse/index.html\nMuscu/index.html'
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          fi
          for DIR in "" Budget Course Muscu; do
            P="${DIR:+$DIR/}"
            if ! printf '%s\n' "$CHANGED" | grep -qxF -e "${P}index.html" -e "${P}style.css" -e "${P}app.js"; then continue; fi
            echo "→ ${P:-racine (Portail)}"
            PREFIX=$(sed -nE "s/^const CACHE_PREFIX = '([^']*)';.*/\1/p" "${P}sw.js")
            test -n "$PREFIX"
            VER=$(printf '%s' "$NOW" | tr -dc '0-9')
            sed -i -E "s/(DERNIERE_MAJ = ')[^']*(')/\1${NOW}\2/" "${P}index.html"
            sed -i -E "s/(style\.css\?v=)[0-9]*/\1${VER}/; s/(app\.js\?v=)[0-9]*/\1${VER}/" "${P}index.html"
            sed -i -E "s/^(const CACHE_NAME = ')[^']*(';)/\1${PREFIX}r${RUN_NUMBER}\2/" "${P}sw.js"
            test "$(grep -c "DERNIERE_MAJ = '${NOW}'" "${P}index.html")" = "1"
            test "$(grep -c "style\.css?v=${VER}" "${P}index.html")" = "1"
            test "$(grep -c "app\.js?v=${VER}" "${P}index.html")" = "1"
            test "$(grep -c "^const CACHE_NAME = '${PREFIX}r${RUN_NUMBER}';" "${P}sw.js")" = "1"
          done
          if git diff --quiet; then echo "Rien à mettre à jour"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: DERNIERE_MAJ + cache SW mis à jour automatiquement"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUSHED=1" >> "$GITHUB_ENV"

      - name: Relancer la publication GitHub Pages
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Build Pages déjà en cours ou non requis"
